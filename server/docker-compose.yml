services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports: ["1433:1433"]
    volumes: ["sql_data:/var/opt/mssql"]
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=POSFlutter;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
    ports: ["7043:8080"]
    depends_on: [sqlserver]
volumes:
  sql_data:
