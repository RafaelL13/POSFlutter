name: pos_app
description: POS offline-first para tablet Android con sincronizacion a ASP.NET Core.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.6.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.0.0
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
